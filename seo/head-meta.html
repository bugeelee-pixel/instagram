<!--
  메디박스 홈페이지 <head> 안에 붙여 넣는 메타 태그입니다.
  {{ }} 로 감싼 부분은 실제 정보로 바꿔 주세요.
  아임웹·Wix 등 빌더를 쓰는 경우: 사이트 설정 > SEO(검색엔진 최적화) 메뉴의
  제목·설명·대표 이미지 칸에 같은 내용을 넣고, 나머지는 "헤더 코드 삽입" 칸에 넣습니다.
-->

<!-- 1. 기본 SEO: 제목은 60자, 설명은 80~120자 안쪽 권장 -->
<title>메디박스 창고형 약국 | {{지역}} 저렴한 대형 약국</title>
<meta name="description" content="{{지역}} 창고형 약국 메디박스. 일반의약품·영양제·건강기능식품·생활용품을 창고형 매장에서 합리적인 가격에 만나보세요. 약사 상담 가능, 주차 {{가능/불가}}, 영업시간 {{평일 00:00~00:00}}.">
<link rel="canonical" href="https://hello.medibox.my/">
<meta name="robots" content="index, follow, max-image-preview:large">
<!-- 문서 맨 위 <html> 태그에 lang="ko" 속성이 있는지 확인: <html lang="ko"> -->

<!-- 2. 검색엔진 소유 확인 (각 서비스에서 발급받은 값으로 교체) -->
<meta name="naver-site-verification" content="{{네이버 서치어드바이저 발급값}}">
<meta name="google-site-verification" content="{{구글 서치콘솔 발급값}}">

<!-- 3. SNS·카카오톡 공유 미리보기 (Open Graph) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="메디박스">
<meta property="og:title" content="메디박스 창고형 약국 | {{지역}} 저렴한 대형 약국">
<meta property="og:description" content="일반의약품·영양제·생활건강용품을 창고형 매장에서 합리적인 가격에. 약사 상담 가능.">
<meta property="og:url" content="https://hello.medibox.my/">
<meta property="og:image" content="https://hello.medibox.my/{{매장사진-1200x630.jpg}}">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
